name: SMS cron (delivery sync, retries, sender ID sync)

# Vercel's Hobby plan only allows daily cron jobs, which is too slow for a live
# SMS platform (stuck messages could sit unresolved for up to 24h). This runs
# the same authenticated cron endpoints every 5 minutes instead.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  call-cron-endpoints:
    runs-on: ubuntu-latest
    steps:
      - name: process-sms
        run: |
          code=$(curl -s -o /tmp/process-sms.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.splitsms.com/api/cron/process-sms")
          echo "process-sms status: $code"
          cat /tmp/process-sms.json
          echo
          if [ "$code" != "200" ]; then exit 1; fi

      - name: sync-sender-ids
        run: |
          code=$(curl -s -o /tmp/sync-sender-ids.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.splitsms.com/api/cron/sync-sender-ids")
          echo "sync-sender-ids status: $code"
          cat /tmp/sync-sender-ids.json
          echo
          if [ "$code" != "200" ]; then exit 1; fi
